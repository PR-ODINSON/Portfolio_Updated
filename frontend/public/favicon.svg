<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>

    <!-- Dark background -->
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#080e20"/>
      <stop offset="100%" stop-color="#050a14"/>
    </linearGradient>

    <!-- Brand: cyan → indigo → violet (mirrors site palette) -->
    <linearGradient id="brand" x1="10" y1="6" x2="54" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#22d3ee"/>
      <stop offset="55%"  stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Border -->
    <linearGradient id="borderG" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.30"/>
    </linearGradient>

    <!-- Subtle top-left glass highlight -->
    <radialGradient id="shine" cx="25%" cy="18%" r="55%">
      <stop offset="0%"   stop-color="white" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow for the letter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- Background tile -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Glass sheen -->
  <rect width="64" height="64" rx="14" fill="url(#shine)"/>

  <!-- Border ring -->
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.5"
        fill="none" stroke="url(#borderG)" stroke-width="1.5"/>

  <!--
    "P" letterform
    Outer shape: full P silhouette  (stem + bowl)
    Inner shape: bowl counter       (the hole inside the bowl)
    fill-rule="evenodd" punches the hole out automatically.

    Geometry (64×64 canvas):
      Stem    : x 13→21, y 9→55   (width 8)
      Bowl    : x 13→53, y 9→43   (right side is a smooth bezier arc)
      Counter : x 21→45, y 17→35  (inset 8 px from bowl edges)
  -->
  <g filter="url(#glow)">
    <path
      fill="url(#brand)"
      fill-rule="evenodd"
      d="
        M 13 9
        H 37
        Q 53 9  53 26
        Q 53 43 37 43
        H 21
        V 55
        H 13
        Z

        M 21 17
        H 35
        Q 45 17 45 26
        Q 45 35 35 35
        H 21
        Z
      "
    />
  </g>

  <!-- Neural-node accent dots — sit exactly where the bowl curve begins/ends -->
  <circle cx="53" cy="9"  r="2.5" fill="#22d3ee" opacity="0.90"/>
  <circle cx="53" cy="43" r="2.0" fill="#a855f7" opacity="0.80"/>

</svg>
